<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP Node Compactor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #1a1a2e; color: #e0e0e0; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .toolbar {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: #16213e; border-bottom: 1px solid #0f3460; flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 16px; color: #e94560; margin-right: 8px; white-space: nowrap; }
  .toolbar button {
    padding: 6px 16px; border-radius: 4px; border: 1px solid #0f3460;
    background: #0f3460; color: #e0e0e0; font-size: 14px; cursor: pointer;
    transition: background 0.2s; white-space: nowrap;
  }
  .toolbar button:hover { background: #e94560; }
  .toolbar button.primary { background: #e94560; border-color: #e94560; }
  .toolbar button.primary:hover { background: #c73650; }
  .toolbar label {
    display: flex; align-items: center; gap: 6px; font-size: 13px;
    cursor: pointer; white-space: nowrap;
  }
  .toolbar input[type="checkbox"] {
    accent-color: #e94560; width: 14px; height: 14px; cursor: pointer;
  }
  .stats {
    padding: 6px 20px; background: #16213e; border-bottom: 1px solid #0f3460;
    font-size: 13px; color: #888; display: flex; gap: 24px; flex-shrink: 0;
    flex-wrap: wrap;
  }
  .stats .highlight { color: #e94560; font-weight: bold; }
  .main {
    display: flex; flex: 1; min-height: 0;
  }
  .pane {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
  }
  .pane:first-child { border-right: 1px solid #0f3460; }
  .pane-header {
    padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460;
    font-size: 13px; color: #888; flex-shrink: 0;
  }
  .pane textarea {
    flex: 1; width: 100%; resize: none; border: none; outline: none;
    background: #1a1a2e; color: #e0e0e0; font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px; line-height: 1.5; padding: 12px 16px;
  }
  .pane textarea::placeholder { color: #555; }
  .pane textarea:focus { background: #1e1e36; }
  .error-banner {
    display: none; padding: 8px 20px; background: #3a1020; border-bottom: 1px solid #e94560;
    font-size: 13px; color: #ff6b8a; flex-shrink: 0;
  }
  .error-banner.visible { display: block; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>BP Node Compactor</h1>
  <button class="primary" id="btnConvert">変換</button>
  <button id="btnCopy">コピー</button>
  <button id="btnClear">クリア</button>
  <label><input type="checkbox" id="chkComment" checked> コメント保持</label>
</div>

<div class="stats" id="stats">
  <span>統計: 入力テキストを貼り付けて「変換」を押してください</span>
</div>

<div class="error-banner" id="errorBanner"></div>

<div class="main">
  <div class="pane">
    <div class="pane-header">入力（UE BP Ctrl+C テキスト）</div>
    <textarea id="input" placeholder="UEエディタでBPノードをCtrl+Cしたテキストをここに貼り付けてください..."></textarea>
  </div>
  <div class="pane">
    <div class="pane-header">出力（コンパクトJSON / LLM向け意味情報）</div>
    <textarea id="output" readonly placeholder="変換結果がここに表示されます..."></textarea>
  </div>
</div>

<script>
'use strict';

// =====================================================================
// Parser: UE BP Ctrl+C text → structured node objects
// =====================================================================

function parseBlocks(text) {
  const blocks = [];
  const lines = text.split('\n');
  let current = [];
  let depth = 0;
  for (const line of lines) {
    const opens = (line.match(/\bBegin Object\b/g) || []).length;
    const closes = (line.match(/\bEnd Object\b/g) || []).length;
    if (depth === 0 && opens > 0) current = [];
    if (depth > 0 || opens > 0) current.push(line);
    depth += opens - closes;
    if (depth === 0 && current.length > 0) {
      blocks.push(current.join('\n'));
      current = [];
    }
  }
  return blocks;
}

function extractQuoted(block, key) {
  const re = new RegExp('^\\s+' + key + '="((?:[^"\\\\]|\\\\.)*)"', 'm');
  const m = block.match(re);
  return m ? m[1].replace(/\\"/g, '"') : null;
}

function extractInt(block, key) {
  const re = new RegExp('^\\s+' + key + '=(-?\\d+)', 'm');
  const m = block.match(re);
  return m ? parseInt(m[1], 10) : null;
}

// UE meta-class names that mean "type unresolved" — when UE writes these as
// the *concrete* type, it actually means it didn't serialize the real type.
// We treat them as null so the type falls back to PinCategory.
const GENERIC_META = new Set([
  'ScriptStruct', 'Class', 'Object', 'Enum', 'Interface',
  'BlueprintGeneratedClass', 'AnimBlueprintGeneratedClass', 'WidgetBlueprintGeneratedClass',
  'UserDefinedStruct', 'UserDefinedEnum', 'Function', 'Property',
]);

// Extract leaf name from /Path/To.AssetName-style refs.
// UE serialization layers these many ways — prefer the innermost concrete path:
//   "/Script/Engine.BlueprintGeneratedClass'/Game/.../FLib_X.FLib_X_C'"  → FLib_X
//   Class'"/Script/Engine.KismetSystemLibrary"'                           → KismetSystemLibrary
//   /Script/Engine.KismetSystemLibrary                                    → KismetSystemLibrary
// Returns null for UE generic meta-class refs (so callers can fall back).
function extractRefName(raw) {
  if (!raw) return null;
  raw = raw.trim();
  if (raw === 'None' || raw === '""' || raw === '') return null;

  // Prefer the LAST single-quoted segment — UE wraps concrete asset paths in
  // single quotes after the metaclass name (e.g. Class'/Path/Asset' or
  // outer-double-quoted "Class'/Path/Asset'").
  let path = null;
  const sqAll = [...raw.matchAll(/'([^']+)'/g)];
  if (sqAll.length > 0) {
    path = sqAll[sqAll.length - 1][1];
  } else {
    const dq = raw.match(/"([^"]+)"/);
    path = dq ? dq[1] : raw;
  }
  // Strip stray surrounding quotes from the inner path.
  path = path.replace(/^["']+|["']+$/g, '');

  const lastDot = path.lastIndexOf('.');
  const lastSlash = path.lastIndexOf('/');
  const start = Math.max(lastDot, lastSlash);
  let name = path.substring(start + 1);
  if (name.endsWith('_C')) name = name.substring(0, name.length - 2);
  if (!name) return null;
  if (GENERIC_META.has(name)) return null;
  return name;
}

// Pull the most informative leaf name out of a BoundGraph / MacroGraph reference,
// skipping the wrapping class name like "EdGraph".
function extractGraphName(raw, ignoreClass) {
  if (!raw) return null;
  const parts = raw.split(/[\/.':"\s]+/).filter(s => s && s !== ignoreClass);
  return parts.length > 0 ? parts[parts.length - 1] : null;
}

function parseHeader(block) {
  const m = block.match(/Begin Object\s+Class=([^\s]+)\s+Name="([^"]+)"/);
  if (!m) return null;
  const classPath = m[1];
  const name = m[2];
  const dotIdx = classPath.lastIndexOf('.');
  let type = dotIdx >= 0 ? classPath.substring(dotIdx + 1) : classPath;
  if (type.startsWith('K2Node_')) type = type.substring(7);
  return { name, type, classPath };
}

// Read a balanced (...) block starting at startIdx (which points just after the opening '(').
function readParenBlock(text, startIdx) {
  let depth = 1;
  let i = startIdx;
  while (i < text.length && depth > 0) {
    const c = text[i];
    if (c === '"') {
      i++;
      while (i < text.length && text[i] !== '"') {
        if (text[i] === '\\') i++;
        i++;
      }
    } else if (c === '(') depth++;
    else if (c === ')') {
      depth--;
      if (depth === 0) break;
    }
    i++;
  }
  return text.substring(startIdx, i);
}

function parseRefBlock(block, key) {
  const marker = key + '=(';
  const idx = block.indexOf(marker);
  if (idx === -1) return null;
  const inner = readParenBlock(block, idx + marker.length);
  const result = {};

  const parentMatch = inner.match(/MemberParent\s*=\s*([^,]+(?:'[^']*')?)/);
  if (parentMatch) {
    const refName = extractRefName(parentMatch[1].trim());
    if (refName) result.member_parent = refName;
  }
  const nameMatch = inner.match(/MemberName\s*=\s*"([^"]*)"/);
  if (nameMatch) result.member_name = nameMatch[1];
  if (/bSelfContext\s*=\s*True/.test(inner)) result.self = true;

  return Object.keys(result).length > 0 ? result : null;
}

// Parse PinType.* fields from a single pin's content string.
function parsePinType(pinStr) {
  const cat = (pinStr.match(/PinType\.PinCategory="([^"]*)"/) || [])[1] || '';
  const subCat = (pinStr.match(/PinType\.PinSubCategory="([^"]*)"/) || [])[1] || '';
  const subObjMatch = pinStr.match(/PinType\.PinSubCategoryObject=([^,)]+(?:'[^']*')?)/);
  const subObj = subObjMatch ? extractRefName(subObjMatch[1]) : null;
  const container = (pinStr.match(/PinType\.ContainerType=(\w+)/) || [])[1] || 'None';

  let valueType = null;
  if (container === 'Map') {
    const valIdx = pinStr.indexOf('PinType.PinValueType=(');
    if (valIdx >= 0) {
      const valStr = readParenBlock(pinStr, valIdx + 'PinType.PinValueType=('.length);
      const valSubMatch = valStr.match(/TerminalSubCategoryObject=([^,)]+(?:'[^']*')?)/);
      if (valSubMatch) valueType = extractRefName(valSubMatch[1]);
      if (!valueType) {
        const valCat = (valStr.match(/TerminalCategory="?([^,)\s"]+)/) || [])[1];
        if (valCat) valueType = valCat;
      }
    }
  }

  const isExec = cat === 'exec';
  const isDelegate = cat === 'delegate' || cat === 'mcdelegate';

  let typeName;
  if (isExec) typeName = 'exec';
  else if (cat === 'wildcard') typeName = 'wildcard';
  else if (subObj) typeName = subObj;
  else if (cat) typeName = cat;
  else typeName = 'unknown';

  if (container === 'Array') typeName += '[]';
  else if (container === 'Set') typeName = 'Set<' + typeName + '>';
  else if (container === 'Map') typeName = 'Map<' + typeName + ', ' + (valueType || '?') + '>';

  return { category: cat, subCategory: subCat, subObject: subObj, container, valueType, type: typeName, isExec, isDelegate };
}

function parsePins(block) {
  const pins = [];
  const re = /CustomProperties Pin \(/g;
  let m;
  while ((m = re.exec(block)) !== null) {
    const start = m.index + m[0].length;
    const pinStr = readParenBlock(block, start);
    const pin = parseSinglePin(pinStr);
    if (pin) pins.push(pin);
  }
  return pins;
}

function parseSinglePin(pinStr) {
  const get = (key) => {
    const re = new RegExp('\\b' + key + '="((?:[^"\\\\]|\\\\.)*)"');
    const mm = pinStr.match(re);
    return mm ? mm[1].replace(/\\"/g, '"') : null;
  };
  const getUnq = (key) => {
    const re = new RegExp('\\b' + key + '=([^,)\\s]+)');
    const mm = pinStr.match(re);
    return mm ? mm[1] : null;
  };

  const pinId = getUnq('PinId');
  const pinName = get('PinName');
  if (!pinId || !pinName) return null;

  const direction = get('Direction');
  const defaultValue = get('DefaultValue');
  const defaultObject = getUnq('DefaultObject');
  const hidden = getUnq('bHidden') === 'True';

  const linkedToMatch = pinStr.match(/LinkedTo=\(([^)]*)\)/);
  let linkedTo = [];
  if (linkedToMatch) {
    const links = linkedToMatch[1].split(',').map(s => s.trim()).filter(Boolean);
    linkedTo = links.map(link => {
      const parts = link.split(/\s+/);
      return { node: parts[0], pinId: parts[1] || '' };
    });
  }

  return {
    pinId,
    name: pinName,
    direction: direction === 'EGPD_Output' ? 'out' : 'in',
    pinType: parsePinType(pinStr),
    defaultValue,
    defaultObject: defaultObject && defaultObject !== 'None' && defaultObject !== '""' ? defaultObject : null,
    linkedTo,
    hidden,
  };
}

// =====================================================================
// Compactor: structured nodes → compact LLM-oriented JSON
// =====================================================================

// When FunctionReference's MemberParent is generic (e.g. Class'/Script/CoreUObject.Class'),
// fall back to the library implied by the K2Node subclass.
const NODE_DEFAULT_PARENT = {
  CallArrayFunction: 'KismetArrayLibrary',
  CallMaterialParameterCollectionFunction: 'KismetMaterialLibrary',
};

// Last-resort: infer the library from the function name pattern.
function inferLibFromMemberName(name) {
  if (!name) return null;
  if (name.startsWith('Array_')) return 'KismetArrayLibrary';
  if (name.startsWith('Set_')) return 'BlueprintSetLibrary';
  if (name.startsWith('Map_')) return 'BlueprintMapLibrary';
  if (/^(Delay|DelayUntilNextTick|PrintString|MakeLiteral|GetGameTimeInSeconds|IsValid|GetClass|K2_)/.test(name)) return 'KismetSystemLibrary';
  return null;
}

const KIND_MAP = {
  CallFunction: 'Call',
  CallArrayFunction: 'Call',
  CallMaterialParameterCollectionFunction: 'Call',
  CallDelegate: 'Call',
  PromotableOperator: 'Op',
  VariableSet: 'VarSet',
  IfThenElse: 'If',
  ExecutionSequence: 'Seq',
  SwitchEnum: 'Switch',
  SwitchInteger: 'Switch',
  SwitchString: 'Switch',
  SwitchName: 'Switch',
  EnumEquality: 'EnumEq',
  EnumLiteral: 'EnumLit',
  BreakStruct: 'Break',
  MakeStruct: 'Make',
  Literal: 'Lit',
  Self: 'Self',
  Cast: 'Cast',
  DynamicCast: 'Cast',
  ClassDynamicCast: 'Cast',
  MacroInstance: 'Macro',
  Composite: 'Subgraph',
  Tunnel: 'Tunnel',
  Event: 'Event',
  CustomEvent: 'CustomEvent',
  FunctionEntry: 'Entry',
  FunctionResult: 'Return',
  AsyncAction_ListenForGameplayMessages: 'Listen',
  Timeline: 'Timeline',
  AddComponent: 'AddComp',
  SpawnActorFromClass: 'Spawn',
};

// Collect non-exec output pins as { pinName: typeName }. Returns null if empty.
// Used to surface "what does this node hand back" — function returns, BreakStruct
// fields, MacroInstance/Composite tunnel outputs, etc.
function collectOutputTypes(pins) {
  const rets = pins.filter(p =>
    p.direction === 'out' && !p.pinType.isExec && !p.pinType.isDelegate && !p.hidden);
  if (rets.length === 0) return null;
  const obj = {};
  for (const r of rets) obj[r.name] = r.pinType.type;
  return obj;
}

function simplifyDefault(val) {
  if (val === null || val === undefined) return null;
  // GameplayTag (TagName="X")
  const tagMatch = typeof val === 'string' ? val.match(/^\(TagName="([^"]*)"\)$/) : null;
  if (tagMatch) return tagMatch[1] === '' ? null : tagMatch[1];
  // GameplayTagContainer (GameplayTags=((TagName="X"),...))
  // Just return raw — too complex to simplify safely
  return val;
}

function execLabel(nodeType, pinName) {
  if (nodeType === 'IfThenElse') {
    if (pinName === 'then') return 'T';
    if (pinName === 'else') return 'F';
  }
  if (nodeType === 'ExecutionSequence') {
    const m = pinName.match(/^then_(\d+)$/);
    if (m) return m[1];
  }
  if (nodeType === 'SwitchEnum' || nodeType === 'SwitchInteger' ||
      nodeType === 'SwitchString' || nodeType === 'SwitchName') {
    if (pinName !== 'execute' && pinName !== 'Default' && pinName !== 'then') return pinName;
  }
  if (nodeType === 'AsyncAction_ListenForGameplayMessages') {
    if (pinName === 'OnMessageReceived') return 'msg';
  }
  if (nodeType === 'MacroInstance') {
    if (/^(LoopBody|For Each|ForEach|Body)$/i.test(pinName)) return 'body';
    if (/^(Completed|Done|Finished)$/i.test(pinName)) return 'done';
    if (pinName === 'IsValid') return 'valid';
    if (pinName === 'IsNotValid') return 'invalid';
  }
  if (nodeType === 'DynamicCast' || nodeType === 'Cast' || nodeType === 'ClassDynamicCast') {
    if (pinName === 'CastSucceeded' || pinName === 'then') return 'ok';
    if (pinName === 'CastFailed') return 'fail';
  }
  return null;
}

function compact(text, opts) {
  const blocks = parseBlocks(text);
  if (blocks.length === 0) {
    throw new Error('有効な Begin Object ... End Object ブロックが見つかりませんでした。');
  }

  // Pass 1: parse all node skeletons
  const allNodes = [];
  for (const block of blocks) {
    const header = parseHeader(block);
    if (!header) continue;
    allNodes.push({
      id: header.name,
      type: header.type,
      classPath: header.classPath,
      block,
      pins: parsePins(block),
      pos: { x: extractInt(block, 'NodePosX'), y: extractInt(block, 'NodePosY') },
      size: { w: extractInt(block, 'NodeWidth'), h: extractInt(block, 'NodeHeight') },
      comment: extractQuoted(block, 'NodeComment'),
    });
  }

  // PinId → {node, pin}
  const pinMap = {};
  for (const n of allNodes) {
    for (const p of n.pins) pinMap[p.pinId] = { node: n, pin: p };
  }

  // Knot bypass: walk through chains of Knot nodes transparently.
  // Returns an array of resolved {node, pin} destinations (Knots can branch).
  function followKnots(node, pin, isExec) {
    const out = [];
    const stack = [{ node, pin }];
    const visited = new Set();
    while (stack.length > 0) {
      const cur = stack.pop();
      const key = cur.node.id + ':' + cur.pin.pinId;
      if (visited.has(key)) continue;
      visited.add(key);
      if (cur.node.type !== 'Knot') {
        out.push(cur);
        continue;
      }
      const nextPin = cur.node.pins.find(pp => pp.direction === 'out' && (isExec ? pp.pinType.isExec : !pp.pinType.isExec));
      if (!nextPin) continue;
      for (const link of nextPin.linkedTo) {
        const target = pinMap[link.pinId];
        if (!target) continue;
        stack.push(target);
      }
    }
    return out;
  }

  // Walk backwards through Knots on a self/Target input pin to find the source VariableGet.
  function traceVarGetThroughKnots(linkedTo) {
    const stack = [...linkedTo];
    const visited = new Set();
    while (stack.length > 0) {
      const link = stack.pop();
      if (visited.has(link.pinId)) continue;
      visited.add(link.pinId);
      const tgt = pinMap[link.pinId];
      if (!tgt) continue;
      if (tgt.node.type === 'Knot') {
        const inPin = tgt.node.pins.find(p => p.direction === 'in' && !p.pinType.isExec);
        if (inPin) stack.push(...inPin.linkedTo);
        continue;
      }
      if (tgt.node.type === 'VariableGet') return tgt.node;
    }
    return null;
  }

  const outNodes = {};
  const execEdges = [];
  const dataEdges = [];
  const variables = {};       // name → typeName
  const varGetterPins = {};   // pinId → variable name

  // Pass 2: classify each node and collect VariableGet pins.
  for (const n of allNodes) {
    if (n.type === 'Knot') continue;

    if (n.type === 'VariableGet') {
      const ref = parseRefBlock(n.block, 'VariableReference');
      if (ref && ref.member_name) {
        const outPin = n.pins.find(p => p.direction === 'out' && !p.pinType.isExec && !p.hidden);
        if (outPin) {
          if (!variables[ref.member_name]) variables[ref.member_name] = outPin.pinType.type;
          varGetterPins[outPin.pinId] = ref.member_name;
        }
      }
      continue;
    }

    if (n.type === 'EdGraphNode_Comment') continue; // handled later as groups

    const out = { k: KIND_MAP[n.type] || n.type };

    switch (n.type) {
      case 'CallFunction':
      case 'CallArrayFunction':
      case 'CallMaterialParameterCollectionFunction':
      case 'CallDelegate':
      case 'PromotableOperator': {
        const fn = parseRefBlock(n.block, 'FunctionReference');
        if (fn) {
          let parent = fn.member_parent; // already null if generic meta-class

          // 1) Self-context call → owning BP itself
          if (!parent && fn.self) parent = 'self';

          const selfPin = n.pins.find(p => (p.name === 'self' || p.name === 'Target') && p.direction === 'in');

          // 2) Concrete class name on self pin (interfaces, components etc.)
          if (!parent && selfPin && selfPin.pinType.subObject) {
            parent = selfPin.pinType.subObject;
          }

          // 3) Trace self pin's incoming connection back to a VariableGet — use the var name
          //    as a human-readable parent (e.g. 'Outfit Control Comp').
          if (!parent && selfPin && selfPin.linkedTo.length > 0) {
            const varNode = traceVarGetThroughKnots(selfPin.linkedTo);
            if (varNode) {
              const vref = parseRefBlock(varNode.block, 'VariableReference');
              if (vref && vref.member_name) parent = vref.member_name;
            }
          }

          // 4) K2Node-subclass implies a known library
          if (!parent) parent = NODE_DEFAULT_PARENT[n.type] || null;

          // 5) Function-name pattern fallback (Array_*, Delay, etc.)
          if (!parent) parent = inferLibFromMemberName(fn.member_name);

          if (!parent) parent = '?';
          out.fn = parent + '::' + (fn.member_name || '?');
        }
        // bIsPureFunc on K2Node_CallFunction, bDefaultsToPureFunc on K2Node_PromotableOperator.
        if (/bIsPureFunc\s*=\s*True|bDefaultsToPureFunc\s*=\s*True/.test(n.block)) out.pure = true;
        const fnRets = collectOutputTypes(n.pins);
        if (fnRets) out.ret = fnRets;
        break;
      }
      case 'VariableSet': {
        const ref = parseRefBlock(n.block, 'VariableReference');
        if (ref && ref.member_name) {
          out.var = ref.member_name;
          const inPin = n.pins.find(p => p.direction === 'in' && p.name === ref.member_name);
          if (inPin) {
            if (!variables[ref.member_name]) variables[ref.member_name] = inPin.pinType.type;
            if (inPin.linkedTo.length === 0) {
              const d = simplifyDefault(inPin.defaultValue);
              if (d !== null) out.to = d;
            }
          }
        }
        break;
      }
      case 'Event': {
        const ref = parseRefBlock(n.block, 'EventReference');
        if (ref && ref.member_name) out.name = ref.member_name;
        else {
          const ovr = parseRefBlock(n.block, 'OverrideFunction');
          if (ovr && ovr.member_name) out.name = ovr.member_name;
        }
        // Event params are output pins (delegates filtered out by collectOutputTypes).
        // Mirrors CustomEvent so interface/override events surface their param types.
        const args = collectOutputTypes(n.pins);
        if (args) out.args = args;
        break;
      }
      case 'CustomEvent': {
        const cName = extractQuoted(n.block, 'CustomFunctionName');
        if (cName) out.name = cName;
        const args = collectOutputTypes(n.pins);
        if (args) out.args = args;
        break;
      }
      case 'FunctionEntry': {
        // Function entry node — output pins are the function's parameters.
        const ref = parseRefBlock(n.block, 'FunctionReference');
        if (ref && ref.member_name) out.name = ref.member_name;
        const args = collectOutputTypes(n.pins);
        if (args) out.args = args;
        break;
      }
      case 'FunctionResult': {
        // Function return node — input pins are the values being returned.
        const ref = parseRefBlock(n.block, 'FunctionReference');
        if (ref && ref.member_name) out.name = ref.member_name;
        const rets = n.pins.filter(p =>
          p.direction === 'in' && !p.pinType.isExec && !p.pinType.isDelegate && !p.hidden);
        if (rets.length > 0) {
          out.ret = {};
          for (const r of rets) out.ret[r.name] = r.pinType.type;
        }
        break;
      }
      case 'AsyncAction_ListenForGameplayMessages': {
        const chPin = n.pins.find(p => p.name === 'Channel');
        if (chPin && chPin.defaultValue) {
          const tagMatch = chPin.defaultValue.match(/TagName="([^"]+)"/);
          if (tagMatch) out.ch = tagMatch[1];
        }
        // Prefer PayloadType input pin's class default — that's the user-set struct type.
        const ptPin = n.pins.find(p => p.name === 'PayloadType');
        if (ptPin && ptPin.defaultObject) {
          const ref = extractRefName(ptPin.defaultObject);
          if (ref) out.payload = ref;
        }
        // Fallback: trace consumer Break pin's struct type
        if (!out.payload) {
          const payloadPin = n.pins.find(p => p.name === 'Payload' && p.direction === 'out');
          if (payloadPin && payloadPin.linkedTo.length > 0) {
            const tgt = pinMap[payloadPin.linkedTo[0].pinId];
            if (tgt && tgt.pin.pinType.subObject) out.payload = tgt.pin.pinType.subObject;
          }
        }
        break;
      }
      case 'BreakStruct':
      case 'MakeStruct': {
        const sMatch = n.block.match(/StructType=([^\r\n,]+)/);
        if (sMatch) {
          const s = extractRefName(sMatch[1].trim());
          if (s) out.struct = s;
        }
        // BreakStruct outputs are the struct's individual fields — surface them.
        // MakeStruct's lone output is the struct itself, already named via `struct`.
        if (n.type === 'BreakStruct') {
          const breakRets = collectOutputTypes(n.pins);
          if (breakRets) out.ret = breakRets;
        }
        break;
      }
      case 'SwitchEnum': {
        // Try multiple enum field forms
        let eMatch = n.block.match(/Enum=([^\r\n,]+)/);
        if (!eMatch) eMatch = n.block.match(/EnumType=([^\r\n,]+)/);
        if (eMatch) {
          const e = extractRefName(eMatch[1].trim());
          if (e) out.enum = e;
        }
        break;
      }
      case 'EnumEquality': {
        const aPin = n.pins.find(p => p.name === 'A' && p.direction === 'in');
        if (aPin && aPin.pinType.subObject) out.enum = aPin.pinType.subObject;
        break;
      }
      case 'MacroInstance': {
        const mIdx = n.block.indexOf('MacroGraphReference=(');
        if (mIdx >= 0) {
          const inner = readParenBlock(n.block, mIdx + 'MacroGraphReference=('.length);
          const graphMatch = inner.match(/MacroGraph=([^,)]+)/);
          if (graphMatch) {
            const name = extractGraphName(graphMatch[1].trim(), 'EdGraph');
            if (name) out.ref = name;
          }
        }
        const macroRets = collectOutputTypes(n.pins);
        if (macroRets) out.ret = macroRets;
        break;
      }
      case 'Composite': {
        const bgMatch = n.block.match(/BoundGraph=([^\r\n]+)/);
        if (bgMatch) {
          const name = extractGraphName(bgMatch[1].trim(), 'EdGraph');
          if (name) out.name = name;
        }
        const compRets = collectOutputTypes(n.pins);
        if (compRets) out.ret = compRets;
        break;
      }
      case 'Tunnel': {
        // Composite/MacroInstance entry/exit tunnel.
        // bCanHaveOutputs=True → entry: outputs are the subgraph's input params (args).
        // bCanHaveInputs=True  → exit: inputs are the subgraph's return values (ret).
        if (/bCanHaveOutputs\s*=\s*True/.test(n.block)) {
          const args = collectOutputTypes(n.pins);
          if (args) out.args = args;
        }
        if (/bCanHaveInputs\s*=\s*True/.test(n.block)) {
          const rets = n.pins.filter(p =>
            p.direction === 'in' && !p.pinType.isExec && !p.pinType.isDelegate && !p.hidden);
          if (rets.length > 0) {
            out.ret = {};
            for (const r of rets) out.ret[r.name] = r.pinType.type;
          }
        }
        break;
      }
      case 'DynamicCast':
      case 'ClassDynamicCast': {
        const tgtMatch = n.block.match(/TargetType=([^\r\n,]+)/);
        if (tgtMatch) {
          const t = extractRefName(tgtMatch[1].trim());
          if (t) out.to = t;
        }
        break;
      }
      case 'SpawnActorFromClass': {
        // ActorClass pin holds default
        const ac = n.pins.find(p => p.name === 'Class' || p.name === 'ActorClass');
        if (ac && ac.defaultObject) {
          const r = extractRefName(ac.defaultObject);
          if (r) out.cls = r;
        }
        break;
      }
    }

    // Default-value inputs (unconnected only — connected ones live in `data` flows).
    // Skip pins whose information is already surfaced elsewhere on the node.
    const ins = {};
    for (const p of n.pins) {
      if (p.direction !== 'in' || p.pinType.isExec || p.hidden || p.linkedTo.length > 0) continue;

      // Per-node-type duplicate suppression
      if (n.type === 'VariableSet' && out.var && p.name === out.var) continue;
      if (n.type === 'AsyncAction_ListenForGameplayMessages') {
        if (p.name === 'Channel') continue;       // already in `ch`
        if (p.name === 'PayloadType') continue;   // already in `payload`
        if (p.name === 'MatchType' && /ExactMatch/i.test(p.defaultValue || '')) continue;
      }

      const objRef = p.defaultObject ? extractRefName(p.defaultObject) : null;
      const v = simplifyDefault(p.defaultValue);
      let value = objRef !== null ? objRef : v;
      if (value === null || value === '' || value === 'None') continue;
      // For enum byte values, prefix with type so the LLM sees 'EShelfType.Common' not bare 'Common'
      if (p.pinType.category === 'byte' && p.pinType.subObject && typeof value === 'string' &&
          !/^\d/.test(value) && value !== 'False' && value !== 'True') {
        value = p.pinType.subObject + '.' + value;
      }
      ins[p.name] = value;
    }
    if (Object.keys(ins).length > 0) out.in = ins;

    // Per-node author comment (if any) — distinct from comment-box groups
    if (opts.keepComments && n.comment) {
      out.note = n.comment;
    }

    outNodes[n.id] = out;
  }

  // Pass 3: emit flows
  // VariableGet is included so its outgoing data edges become `vars:Name -> X:Y`,
  // but its outgoing exec edges (none typically) are skipped via isExec check.
  for (const n of allNodes) {
    if (n.type === 'Knot' || n.type === 'EdGraphNode_Comment') continue;

    for (const p of n.pins) {
      if (p.direction !== 'out' || p.linkedTo.length === 0 || p.hidden) continue;

      for (const link of p.linkedTo) {
        const target = pinMap[link.pinId];
        if (!target) continue;

        const resolvedList = followKnots(target.node, target.pin, p.pinType.isExec);
        for (const resolved of resolvedList) {
          if (resolved.node.type === 'VariableGet' || resolved.node.type === 'EdGraphNode_Comment') continue;
          if (resolved.node.id === n.id) continue; // self-loop guard (composite leaks)

          if (p.pinType.isExec) {
            const lbl = execLabel(n.type, p.name);
            const src = lbl ? n.id + ':' + lbl : n.id;
            execEdges.push([src, resolved.node.id]);
          } else {
            let src;
            if (varGetterPins[p.pinId]) {
              src = 'vars:' + varGetterPins[p.pinId];
            } else {
              src = n.id + ':' + p.name;
            }
            const dst = resolved.node.id + ':' + resolved.pin.name;
            dataEdges.push([src, dst]);
          }
        }
      }
    }
  }

  // Dedup edges (Composites can produce duplicates from internal pin leaks).
  const dedupEdges = (arr) => {
    const seen = new Set();
    const out = [];
    for (const [a, b] of arr) {
      const key = a + '␀' + b;
      if (seen.has(key)) continue;
      seen.add(key);
      out.push([a, b]);
    }
    return out;
  };

  // Pass 4: comment-box groups (use position bounds to compute containment).
  const groups = [];
  if (opts.keepComments) {
    const comments = allNodes.filter(n => n.type === 'EdGraphNode_Comment' && n.pos.x !== null);
    const others = allNodes.filter(n =>
      n.type !== 'EdGraphNode_Comment' && n.type !== 'Knot' && n.type !== 'VariableGet' && n.pos.x !== null);

    for (const c of comments) {
      const cx = c.pos.x, cy = c.pos.y;
      const cw = c.size.w || 400;
      const ch = c.size.h || 200;
      const contained = [];
      for (const o of others) {
        if (o.pos.x >= cx && o.pos.x <= cx + cw &&
            o.pos.y >= cy && o.pos.y <= cy + ch) {
          contained.push(o.id);
        }
      }
      if (contained.length > 0 && c.comment) {
        groups.push({ label: c.comment, nodes: contained });
      } else if (c.comment) {
        // Standalone comment with no contained nodes — keep as a node so info isn't lost.
        outNodes[c.id] = { k: 'Comment', text: c.comment };
      }
    }
  }

  const result = {};
  if (Object.keys(variables).length > 0) result.vars = variables;
  if (groups.length > 0) result.groups = groups;
  result.nodes = outNodes;
  const eExec = dedupEdges(execEdges);
  const eData = dedupEdges(dataEdges);
  if (eExec.length > 0) result.exec = eExec;
  if (eData.length > 0) result.data = eData;

  return result;
}

// =====================================================================
// UI
// =====================================================================

const inputEl = document.getElementById('input');
const outputEl = document.getElementById('output');
const statsEl = document.getElementById('stats');
const errorEl = document.getElementById('errorBanner');
const btnConvert = document.getElementById('btnConvert');
const btnCopy = document.getElementById('btnCopy');
const btnClear = document.getElementById('btnClear');
const chkComment = document.getElementById('chkComment');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('visible');
}
function hideError() { errorEl.classList.remove('visible'); }

function doConvert() {
  hideError();
  const raw = inputEl.value.trim();
  if (!raw) {
    outputEl.value = '';
    statsEl.innerHTML = '<span>統計: 入力テキストを貼り付けて「変換」を押してください</span>';
    return;
  }
  try {
    const result = compact(raw, { keepComments: chkComment.checked });
    const json = JSON.stringify(result, null, 2);
    outputEl.value = json;

    const origLen = raw.length;
    const compLen = json.length;
    const reduction = ((1 - compLen / origLen) * 100).toFixed(1);
    const nodeCount = Object.keys(result.nodes || {}).length;
    statsEl.innerHTML =
      '<span>元テキスト: <span class="highlight">' + origLen.toLocaleString() + '</span> 文字</span>' +
      '<span>コンパクト後: <span class="highlight">' + compLen.toLocaleString() + '</span> 文字</span>' +
      '<span>削減率: <span class="highlight">' + reduction + '%</span></span>' +
      '<span>ノード数: <span class="highlight">' + nodeCount + '</span></span>' +
      '<span>変数: <span class="highlight">' + Object.keys(result.vars || {}).length + '</span></span>' +
      '<span>グループ: <span class="highlight">' + (result.groups || []).length + '</span></span>';
  } catch (e) {
    showError('パースエラー: ' + e.message);
    outputEl.value = '';
  }
}

btnConvert.addEventListener('click', doConvert);
btnCopy.addEventListener('click', () => {
  const text = outputEl.value;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const orig = btnCopy.textContent;
    btnCopy.textContent = 'コピー済み!';
    setTimeout(() => { btnCopy.textContent = orig; }, 1500);
  });
});
btnClear.addEventListener('click', () => {
  inputEl.value = '';
  outputEl.value = '';
  hideError();
  statsEl.innerHTML = '<span>統計: 入力テキストを貼り付けて「変換」を押してください</span>';
});
inputEl.addEventListener('paste', () => { setTimeout(doConvert, 50); });
</script>
</body>
</html>
